name: Deploy to Google Apps Script

# ينشر apps-script/Code.gs و apps-script/Index.html تلقائياً إلى مشروع Apps Script الفعلي
# ويُحدِّث نفس النشر الحالي (Deployment ID) فيبقى رابط التطبيق كما هو دون تغيير.
on:
  push:
    branches:
      - claude/google-apps-script-review-oaojxq
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # v5 — تبيّن من خطوة التشخيص (أسماء المفاتيح فقط) أن ~/.clasprc.json الفعلي شكله:
      # { "tokens": { "default": { client_id, client_secret, refresh_token, access_token, type } } }
      # وهذا هو شكل بيانات الدخول في clasp 3.x تحديداً (وليس شكل 2.x القديم { "token": {...},
      # "oauth2ClientSettings": {...} }) — لذلك نُثبِّت 3.x لتتوافق مع شكل السرّ الفعلي، بدل تثبيت 2.x
      - name: Install clasp
        run: |
          npm install -g @google/clasp@3
          clasp --version

      # v3 — يُمرَّر السرّ عبر متغيّر بيئة (أكثر أماناً من تضمينه مباشرة داخل run:)، ثم يُصلَح عبر
      # .github/scripts/sanitize-clasprc.js: بعض أدوات اللصق تُدخل حرف تحكّم خام داخل قيمة نصية
      # (وليس بين العناصر) فيفشل JSON.parse بخطأ "Bad control character in string literal" —
      # تجربة tr -d '\r' وحدها لم تكن كافية لأن الحرف المسبِّب قد يكون غير \r (مثل \n خام داخل قيمة)
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          node .github/scripts/sanitize-clasprc.js

      # خطوة تشخيص مؤقتة: تطبع فقط أسماء المفاتيح داخل clasprc.json (بدون أي قيم فعلية)
      # لمعرفة البنية الحقيقية للسرّ المخزَّن ومقارنتها بما يتوقعه clasp 2.x — ستُحذف بعد التشخيص
      - name: Diagnose clasprc structure (no secret values printed)
        run: node .github/scripts/diagnose-clasprc.js

      - name: Prepare clasp project directory
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          mkdir -p .clasp-deploy
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp-deploy/.clasp.json

      # يجلب appsscript.json الحالي (والملفات الأخرى إن وُجدت) من المشروع الفعلي أولاً،
      # حتى لا تحتاج متابعة إعدادات الـ manifest يدوياً هنا — هي تبقى كما ضُبطت بمحرر Apps Script
      - name: Pull current manifest from Apps Script
        working-directory: .clasp-deploy
        env:
          DEBUG: 'clasp:*'
        run: clasp pull

      # الآن نستبدل Code.gs و Index.html بالنسخة المعتمدة من المستودع (مصدر الحقيقة الوحيد)
      - name: Apply repo source files
        run: |
          cp apps-script/Code.gs .clasp-deploy/Code.gs
          cp apps-script/Index.html .clasp-deploy/Index.html

      - name: Push to Apps Script
        working-directory: .clasp-deploy
        run: clasp push --force

      - name: Deploy (update existing deployment — same URL)
        working-directory: .clasp-deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          clasp deploy --deploymentId "$DEPLOYMENT_ID" \
            --description "Auto-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) — ${{ github.sha }}"
