name: Pull performance report

# يسحب تقرير أداء الخادم يومياً من التطبيق المنشور ويحفظه كملف JSON في المستودع، ليُحلَّل لاحقاً
# دون أي لصق يدوي لأي بيانات. رابط التطبيق يُبنى من السرّ الموجود أصلاً APPS_SCRIPT_DEPLOYMENT_ID
# (https://script.google.com/macros/s/<ID>/exec) — ويُقبل فيه المعرّف وحده أو الرابط كاملاً.
# السرّ الجديد الوحيد المطلوب: PERF_REPORT_SECRET بنفس القيمة هنا وفي Script Properties لمشروع
# Apps Script (Project Settings ← Script Properties). قبل ضبطه تفشل الخطوة برسالة واضحة، لا بعطل.
on:
  workflow_dispatch: {}
  schedule:
    # 02:17 UTC يومياً - خارج ساعات الذروة المتوقعة، ودقيقة غير مستديرة لتفادي ازدحام الجدولة العام
    - cron: '17 2 * * *'

jobs:
  pull-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # السرّ يُمرَّر عبر متغيّر بيئة وُيستخدَم فقط داخل --form-string/curl بملف ناتج مباشر - لا يُطبع
      # أبداً، ولا يُبنى رابط كامل يحتوي المفتاح يُطبع في السجل بأي خطوة
      - name: Fetch performance report from the deployed app
        env:
          DEPLOYMENT_ID_RAW: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          PERF_REPORT_SECRET: ${{ secrets.PERF_REPORT_SECRET }}
        run: |
          if [ -z "$PERF_REPORT_SECRET" ]; then
            echo "::error::لم يُضبط بعد السرّ PERF_REPORT_SECRET — أضفه من Settings ← Secrets and variables ← Actions، وبنفس القيمة في Script Properties لمشروع Apps Script."
            exit 1
          fi
          # يقبل المعرّف وحده أو رابط /exec كاملاً في السرّ نفسه
          DEPLOYMENT_ID=$(printf '%s' "$DEPLOYMENT_ID_RAW" | tr -d '[:space:]' | sed -E 's#^.*/macros/s/([^/?]+).*$#\1#')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::السرّ APPS_SCRIPT_DEPLOYMENT_ID فارغ."
            exit 1
          fi
          # -L ضروري: رابط /exec يُعيد توجيهاً (302) إلى script.googleusercontent.com حيث الرد الفعلي
          curl -sS -L --fail-with-body \
            -G "https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec" \
            --data-urlencode "action=perfReport" \
            --data-urlencode "key=$PERF_REPORT_SECRET" \
            -o raw_response.json

      - name: Validate response is well-formed JSON with success:true
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('raw_response.json', 'utf8');
            let parsed;
            try { parsed = JSON.parse(raw); } catch (e) {
              console.error('الرد ليس JSON صالحاً — غالباً صفحة تسجيل دخول جوجل: تأكد أن النشر مضبوط على Who has access = Anyone.');
              process.exit(1);
            }
            if (!parsed.success) {
              console.error('الخادم رفض الطلب: ' + (parsed.error || 'سبب غير معروف') + ' — تأكد أن PERF_REPORT_SECRET مطابق تماماً في GitHub وScript Properties معاً.');
              process.exit(1);
            }
            if (!parsed.data || !parsed.data.version) {
              console.error('الرد صالح لكن بلا حقل version داخل data.');
              process.exit(1);
            }
            fs.writeFileSync('report_data.json', JSON.stringify(parsed.data, null, 2));
            console.log('✅ تقرير صالح لإصدار ' + parsed.data.version);
          "

      - name: Commit report under ops/perf/<version>/<date>.json
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('report_data.json','utf8')).version)")
          DATE=$(date -u +%Y-%m-%d)
          DEST="ops/perf/$VERSION/$DATE.json"
          mkdir -p "ops/perf/$VERSION"
          mv report_data.json "$DEST"
          rm -f raw_response.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "لا تغيير (نفس بيانات اليوم مسبقاً) - لا حاجة لـ commit."
            exit 0
          fi
          git commit -m "ops/perf: pull performance report for $VERSION @ $DATE"
          git push
