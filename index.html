<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#1e3d59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إدارة الفنادق">
  <!-- منع المتصفح من تخزين نسخة قديمة من هذه الصفحة نفسها -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <title>إدارة الفنادق</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #1e3d59;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: block;
    }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f2419, #1e3d59);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
    }
    /* v4 — زر تفعيل الإشعارات على مستوى الصفحة العليا (يظهر فقط عند الحاجة) */
    #notifPermBtn {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #c9a84c, #b8912e);
      color: #0f2419;
      border: none;
      border-radius: 22px;
      padding: 9px 22px;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      animation: notifPulse 2s ease-in-out infinite;
    }
    @keyframes notifPulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      50% { box-shadow: 0 4px 22px rgba(201,168,76,.75); }
    }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="loader-spinner"></div>
    <div class="loader-text">جاري تحميل نظام إدارة الفنادق...</div>
  </div>

  <!-- v4 — زر طلب إذن الإشعارات: نقرة هنا = User Gesture حقيقي على النافذة العليا فيقبله المتصفح دائماً -->
  <button id="notifPermBtn" onclick="requestNotifPermissionTopLevel()">🔔 اضغط هنا لتفعيل إشعارات النظام</button>

  <iframe id="appFrame" src="" allow="notifications"></iframe>

  <script>
    // كسر كاش رابط تطبيق Apps Script: نُضيف طابعاً زمنياً فريداً لكل تحميل صفحة
    // هذا يُجبر المتصفح على طلب نسخة جديدة تماماً من الخادم بدل الاعتماد على أي نسخة محفوظة سابقاً
    (function() {
      var baseUrl = 'https://script.google.com/macros/s/AKfycbxFySO7Q4pJ41eHkQvWgWpWDzb7Aizok8HckVDBBQWcv9e4R7twvhaV7ZSzRyBqwe9y/exec';
      document.getElementById('appFrame').src = baseUrl + '?_cb=' + Date.now();
    })();

    document.getElementById('appFrame').addEventListener('load', function() {
      document.getElementById('loadingScreen').classList.add('hidden');
    });

    setTimeout(function() {
      document.getElementById('loadingScreen').classList.add('hidden');
    }, 8000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('Service Worker Registered');
            // فحص دوري لوجود نسخة جديدة من الـ Service Worker كل مرة تُفتح الصفحة
            reg.update();
          })
          .catch(err => console.log('Service Worker Failed', err));
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // v4 — جسر إشعارات المتصفح (postMessage Bridge)
    // ═══════════════════════════════════════════════════════════════
    // تطبيق Apps Script يعمل داخل iframe على نطاق googleusercontent.com حيث يمنع
    // المتصفح طلبات إذن الإشعارات نهائياً. هذه الصفحة (الغلاف) نافذة عليا حقيقية:
    // تطلب الإذن بشكل طبيعي وتعرض الإشعارات نيابةً عن التطبيق عبر رسائل postMessage.
    // بروتوكول الرسائل:
    //   من التطبيق → hotelapp_bridge_ping        : "هل الغلاف موجود؟ وما حالة الإذن؟"
    //   من التطبيق → hotelapp_request_permission : "اطلب إذن الإشعارات من المستخدم"
    //   من التطبيق → hotelapp_notify             : "اعرض هذا الإشعار الآن"
    //   من الغلاف  → hotelapp_bridge_pong        : الرد بحالة الإذن الحالية
    var __hotelappWin = null; // مرجع نافذة التطبيق الداخلية (لإرسال الردود إليها)

    function _notifPermissionState() {
      return ('Notification' in window) ? Notification.permission : 'unsupported';
    }

    function _replyPermissionToApp() {
      if (!__hotelappWin) return;
      try {
        __hotelappWin.postMessage({ type: 'hotelapp_bridge_pong', permission: _notifPermissionState() }, '*');
      } catch (e) {}
    }

    // إظهار/إخفاء زر التفعيل العلوي حسب حالة الإذن
    function _syncNotifBtn() {
      var btn = document.getElementById('notifPermBtn');
      if (!btn) return;
      btn.style.display = (_notifPermissionState() === 'default') ? 'flex' : 'none';
    }

    // نقرة الزر = User Gesture على النافذة العليا → طلب الإذن يعمل دائماً
    function requestNotifPermissionTopLevel() {
      if (!('Notification' in window)) return;
      Notification.requestPermission().then(function(res) {
        console.log('[Wrapper] نتيجة طلب إذن الإشعارات:', res);
        _syncNotifBtn();
        _replyPermissionToApp();
        if (res === 'granted') {
          _showWrapperNotification({ title: '✅ إشعارات النظام مفعّلة', body: 'ستصلك تنبيهات إدارة الفنادق فوراً من الآن.' });
        }
      }).catch(function(){});
    }

    // العرض الفعلي للإشعار — عبر Service Worker إن أمكن (أوثق وأبقى)، وإلا فالمنشئ المباشر
    function _showWrapperNotification(d) {
      if (_notifPermissionState() !== 'granted') return;
      var title = String(d.title || 'إشعار جديد').slice(0, 120);
      var opts = {
        body: String(d.body || '').slice(0, 300),
        icon: 'icon-512.png',
        badge: 'icon-512.png',
        tag: String(d.tag || Date.now()),
        dir: 'rtl',
        lang: 'ar'
      };
      // نحاول عبر Service Worker أولاً (أوثق)، مع مهلة قصيرة: ready لا يُرفض أبداً
      // حسب المواصفة — لو لم يجهز خلال 1.5 ثانية نعرض الإشعار مباشرة كي لا يضيع
      var shown = false;
      function showDirect() {
        if (shown) return;
        shown = true;
        try { new Notification(title, opts); } catch (e) {}
      }
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        var swTimeout = setTimeout(showDirect, 1500);
        navigator.serviceWorker.ready.then(function(reg) {
          clearTimeout(swTimeout);
          if (shown) return;
          shown = true;
          if (reg && reg.showNotification) reg.showNotification(title, opts);
          else { shown = false; showDirect(); }
        });
      } else {
        showDirect();
      }
    }

    // استقبال رسائل التطبيق الداخلي
    window.addEventListener('message', function(ev) {
      var d = ev.data || {};
      if (!d || typeof d.type !== 'string' || d.type.indexOf('hotelapp_') !== 0) return;

      if (d.type === 'hotelapp_bridge_ping') {
        __hotelappWin = ev.source; // نحفظ مرجع نافذة التطبيق للرد عليها لاحقاً
        _replyPermissionToApp();
        _syncNotifBtn(); // إن كان الإذن لم يُطلب بعد، نُظهر زر التفعيل العلوي مباشرة
        return;
      }
      if (d.type === 'hotelapp_request_permission') {
        __hotelappWin = ev.source;
        // نحاول الطلب مباشرة (قد يعرضه المتصفح بواجهة هادئة)، ونُظهر الزر العلوي
        // كخيار نقر مباشر مضمون (User Gesture حقيقي)
        if (_notifPermissionState() === 'default') {
          requestNotifPermissionTopLevel();
          _syncNotifBtn();
        } else {
          _replyPermissionToApp();
        }
        return;
      }
      if (d.type === 'hotelapp_notify') {
        _showWrapperNotification(d);
        return;
      }
    });

    // مزامنة أولية لحالة الزر عند فتح الصفحة
    window.addEventListener('load', _syncNotifBtn);
  </script>
</body>
</html>
